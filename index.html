:root {
  color-scheme: light;
  --page: #f8f6f2; --ink: #292d35; --muted: #686b74;
  --a: #a94e37; --b: #326e7a; --a-glow: #f4d6c2; --b-glow: #cee6e5;
  --illustration-paper: #fffaf0; --button: #2e343b; --button-ink: #fffaf2;
  --ease: cubic-bezier(.22, 1, .36, 1); --theme-time: 500ms;
}
:root[data-theme=dark] {
  color-scheme: dark;
  --page: #191e29; --ink: #f1eee7; --muted: #b3b6c1;
  --a: #f3b397; --b: #9cd4dc; --a-glow: #503b37; --b-glow: #29454f;
  --illustration-paper: #272f3c; --button: #f1eee7; --button-ink: #191e29;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--page); color: var(--ink); font: 17px/1.7 "Academic Sans TC", "Sarasa UI TC", "Microsoft JhengHei", sans-serif; font-synthesis: none; transition: background-color var(--theme-time), color var(--theme-time) }
button { font: inherit; cursor: pointer; color: inherit; -webkit-tap-highlight-color: transparent }
button:disabled { cursor: default }
button:focus-visible { outline: 3px solid var(--b); outline-offset: 6px }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0 }
.theme-toggle { position: absolute; top: 24px; right: 30px; z-index: 10; width: 46px; height: 46px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; transition: transform .3s var(--ease), background-color .3s }
.theme-toggle:hover { background: var(--b-glow); transform: rotate(12deg) }
.theme-toggle svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; grid-area: 1 / 1; transition: opacity .24s, transform .4s var(--ease) }
.sun-icon { opacity: 0; transform: rotate(-70deg) scale(.65) }
.moon-icon { opacity: 1; transform: rotate(0) scale(1) }
[data-theme=dark] .sun-icon { opacity: 1; transform: rotate(0) scale(1) }
[data-theme=dark] .moon-icon { opacity: 0; transform: rotate(70deg) scale(.65) }
.game { width: min(1180px, calc(100% - 80px)); margin: 0 auto; padding: 42px 0 48px }
.counter { display: block; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; letter-spacing: .12em; color: var(--muted) }
.question { text-align: center; max-width: 820px; margin: 34px auto 0 }
h1 { font-size: clamp(29px, 3.3vw, 42px); font-weight: 600; line-height: 1.4; letter-spacing: -.015em; margin: 0 }
.question p { color: var(--muted); margin: 13px 0 0; font-size: 17px; line-height: 1.8 }
.desk { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 170px minmax(0, 1fr); gap: 26px; margin-top: 28px; min-height: 440px }
.option { position: relative; text-align: center; padding: 0 14px 36px; --draw: var(--a); --illustration-fill: var(--a-glow); --glow: var(--a-glow); --turn: -5deg }
.option-a { grid-column: 1 }
.option-b { grid-column: 3; --draw: var(--b); --illustration-fill: var(--b-glow); --glow: var(--b-glow); --turn: 5deg }
.world { position: relative; height: 245px; display: grid; place-items: center; isolation: isolate }
.halo { position: absolute; width: 252px; height: 210px; background: var(--glow); border-radius: 48% 52% 63% 37% / 46% 43% 57% 54%; transform: rotate(var(--turn)); transition: background-color var(--theme-time), transform .6s var(--ease), border-radius .6s var(--ease) }
.option-b .halo { border-radius: 60% 40% 45% 55% / 54% 63% 37% 46% }
.scene { position: relative; width: 192px; height: 192px; transition: transform .6s var(--ease) }
.scene svg { width: 100%; height: 100%; overflow: visible; fill: none; stroke: var(--draw); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; transition: stroke var(--theme-time) }
.scene .solid { fill: var(--illustration-fill) }
.scene .paper { fill: var(--illustration-paper); transition: fill var(--theme-time) }
.sparkles { opacity: .65; stroke-width: 2 }
.option:has(.choose:not(:disabled)):hover .scene, .option.target .scene { transform: translateY(-9px) rotate(var(--turn)) }
.option:has(.choose:not(:disabled)):hover .halo, .option.target .halo { transform: rotate(calc(var(--turn) * -2)) scale(1.07); border-radius: 55% 45% 40% 60% / 40% 55% 45% 60% }
.choice-copy { position: relative; max-width: 390px; margin: 12px auto 0 }
h2 { font-size: clamp(24px, 2.25vw, 29px); line-height: 1.45; letter-spacing: -.01em; margin: 0 0 14px; font-weight: 600 }
.cost { margin: 0; font-size: 18px; line-height: 1.8; text-wrap: pretty }
.choose { position: absolute; inset: 0; width: 100%; border: 0; background: transparent; border-radius: 36px }
.choose:disabled { pointer-events: none }
.option.unselected .world { opacity: .64 }
.option.chosen .halo { transform: rotate(var(--turn)) scale(1.08) }
.selected-note { position: absolute; bottom: 0; left: 0; right: 0; color: var(--draw); font-size: 14px; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s }
.chosen .selected-note { opacity: 1; transform: translateY(0) }
.ballot { position: absolute; z-index: 5; left: calc(50% - 70px); top: 91px; width: 140px; height: 115px; padding: 0; border: 0; background: transparent; transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--angle, -12deg)) scale(var(--scale, 1)); transform-origin: 50% 50%; transition: transform .65s var(--ease); touch-action: none; user-select: none; cursor: grab; filter: drop-shadow(0 12px 10px #00000013) }
.ballot svg { width: 100%; height: 100%; overflow: visible }
.ballot:focus { outline: none }
:root[data-input=keyboard] .ballot:focus-visible:not(.dragging) .plane-paper { stroke: var(--b); stroke-width: 3 }
.plane-shadow { fill: #00000010 }
.plane-paper { fill: #fffdf6; stroke: #85878b; stroke-width: 1.4; stroke-linejoin: round }
.plane-fold { fill: #e1e6ea; stroke: #85878b; stroke-width: 1.3; stroke-linejoin: round }
.plane-wing { fill: none; stroke: #85878b; stroke-width: 1.4; stroke-linejoin: round }
.ballot:hover:not(:disabled) { filter: drop-shadow(0 16px 12px #00000024) }
.ballot.dragging { cursor: grabbing; transition: none; filter: drop-shadow(0 20px 12px #00000028) }
.ballot:disabled { pointer-events: none }
.center-note { position: absolute; top: 229px; left: calc(50% - 90px); width: 180px; margin: 0; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7 }
.reveal { margin-top: 26px }
.actions { display: flex; justify-content: center; align-items: center; gap: 32px }
.text-button { background: transparent; border: 0; padding: 12px 8px; font-size: 16px; color: var(--muted); transition: color .2s, transform .2s var(--ease) }
.text-button:hover { color: var(--ink) }
.next { border: 0; border-radius: 40px; background: var(--button); color: var(--button-ink); padding: 14px 27px; font-size: 16px; font-weight: 600; transition: background-color var(--theme-time), color var(--theme-time), transform .25s var(--ease) }
.next span { display: inline-block; margin-left: 14px; transition: transform .25s var(--ease) }
.next:hover:not(:disabled) { transform: translateY(-3px) }
.next:active:not(:disabled) { transform: translateY(0) scale(.97) }
.text-button:active:not(:disabled) { transform: scale(.97) }
.theme-toggle:active { transform: rotate(12deg) scale(.92) }
.next:hover span { transform: translate(2px, -2px) }
.next:disabled { opacity: .65 }
.ending { min-height: 78vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 32px }

<body>
<noscript><style>.game,.theme-toggle{display:none}</style><p style="max-width:36rem;margin:15vh auto;padding:1.5rem">這個遊戲需要 JavaScript 才能作答。請開啟瀏覽器的 JavaScript，再重新載入頁面。</p></noscript>
<button type="button" id="theme-toggle" class="theme-toggle" aria-label="切換到夜間模式" title="切換到夜間模式">
<svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
<svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></svg>
</button>
<main class="game">
<section id="play" aria-label="兩難遊戲">
<span id="counter" class="counter" aria-label="遊玩進度"></span>
<div class="question"><h1 id="question-title"></h1><p id="premise"></p></div>
<div class="desk" id="desk">
<section class="option option-a" id="drop-a" aria-label="左側選項">
<div class="world" aria-hidden="true"><div class="halo"></div><div id="scene-a" class="scene"></div></div>
<div class="choice-copy" id="copy-a"><h2 id="title-a"></h2><p id="cost-a" class="cost"></p></div>
<span class="selected-note" aria-hidden="true">你的選擇</span>
<button type="button" class="choose" id="choose-a" aria-labelledby="title-a" aria-describedby="cost-a"><span class="sr-only">選擇左側，也可按 1</span></button>
</section>
<section class="option option-b" id="drop-b" aria-label="右側選項">
<div class="world" aria-hidden="true"><div class="halo"></div><div id="scene-b" class="scene"></div></div>
<div class="choice-copy" id="copy-b"><h2 id="title-b"></h2><p id="cost-b" class="cost"></p></div>
<span class="selected-note" aria-hidden="true">你的選擇</span>
<button type="button" class="choose" id="choose-b" aria-labelledby="title-b" aria-describedby="cost-b"><span class="sr-only">選擇右側，也可按 2</span></button>
</section>
<button type="button" class="ballot" id="ballot" aria-label="決定稿紙飛機。拖向左側或右側並放手，也可直接點選選項，或按 1、2。">
<svg viewBox="0 0 160 130" aria-hidden="true"><path class="plane-shadow" d="m15 62 128-45-31 101-34-41-22 20 3-32Z"/><path class="plane-paper" d="M9 53 147 8 111 117 75 73 50 96 55 62Z"/><path class="plane-fold" d="m55 62 92-54-72 65-25 23Z"/><path class="plane-wing" d="m9 53 46 9 92-54M75 73l36 44"/></svg>
</button>
<p id="center-note" class="center-note">把紙飛機送向<br>你的選擇</p>
</div>
<span class="sr-only" id="status" role="status" aria-live="polite"></span>

<p class="result-label">選擇之後</p>
<h2 id="result-title"></h2>
<p id="result-body" class="result-body"></p>
<div class="actions"><button type="button" id="reconsider" class="text-button">重新選擇</button><button type="button" id="next" class="next">下一個兩難 <span aria-hidden="true">↗</span></button></div>
</section>
</section>
<section id="summary" class="ending" hidden aria-label="你的研究人格">
<p class="counter">你的研究人格</p>
<h1 id="profile-title"></h1><p id="profile-lead" class="profile-lead"></p>
<div class="profile-layout"><div class="chart-wrap"><div id="radar-chart"></div><p class="chart-note">越靠外，越偏向軸上的做法。<br>靠內代表另一種偏好，不代表能力較差。</p></div>
<div class="profile-reading"><p id="profile-combination"></p><div class="profile-tip"><span>給下一次研究的你</span><p id="profile-suggestion"></p></div></div></div>

<button type="button" id="restart" class="next">再玩一次 <span aria-hidden="true">↗</span></button>
</section>

<script>
(function (root) {
  'use strict';
  const tones = {
    bitter: { name: '學術苦笑', note: '那些讓人笑不太出來，又真的很好笑的日常。' },
    tradeoff: { name: '研究取捨', note: '兩條路都合理，時間卻只夠走一條。' },
    absurd: { name: '荒謬學術', note: '假如研究世界的規則，可以稍微壞掉一點。' }
  };
  const q = (id, tone, axis, affinities, title, premise, aTitle, aCost, aVoice, bTitle, bCost, bVoice) => ({
    id, tone, axis, title, premise,
    a: { title: aTitle, cost: aCost, voice: aVoice, affinity: affinities[0] },
    b: { title: bTitle, cost: bCost, voice: bVoice, affinity: affinities[1] }
  });
  const bitter = [
    q('B01','bitter','autonomy',[0,1],'教授回信的兩種宇宙','選一種指導教授的回信方式，維持到你畢業。','一天內回信','卡關隔天就能繼續，但每封都有 20 項必改，常把昨天的進度打掉。','你隔天就拿到答案，順手收到二十條新指令。照單改完，昨天的段落也跟著消失。','一個月回信','每次只改一項就能突破瓶頸，但等待期間要自己決定，走錯也得重做。','你先自己選路走了一個月。教授終於回信，只圈出一處；幸好那條路是你自己挑的。'),
    q('B02','bitter','collaboration',[1,0],'Meeting，還是一起做？','接下來一學期，你只能選一種研究推進方式。','每週共同工作兩小時','和同學一起分析、互相解題；要花時間協調，也得接住對方的問題。','你們一起把分析往前推，順手替同學解掉一個卡點；散會時才發現自己的待辦也多了一項。','每週獨立排進度','自己安排每週工作，完整時間能專心推進；卡住時得等下次討論。','你照自己的節奏做完一週進度，安靜又有效率；那個卡住的問題也在筆記裡住滿七天。'),
    q('B03','bitter','rhythm',[1,0],'程式執行也要排班','接下來一學期，你只能替研究程式選一種執行節奏。','每天跑一小段','每天都能看到一點進度，但要天天切回程式處理小結果。','你每天跑一小段，結果慢慢累積；程式每天準時提醒你，今天也有一件事沒做完。','一週集中批次跑','整週先做其他工作，到固定時段一次跑完；那段時間得盯著程式和故障訊息。','你把一週的分析排在週五，批次跑完後一次收拾錯誤；週五的咖啡也一次喝到冷掉。'),
    q('B04','bitter','expression',[1,0],'你說這叫五分鐘簡報？','明天的實驗室會議，你只能選一種分享方式。','粗稿公開談 30 分鐘','只準備十分鐘便帶到全組討論，能換回當場問題，也得公開回答漏洞。','你拿著十分鐘拼出的粗稿上台，漏洞被問得一清二楚，也當場找到下一步。','完成稿只寄導師','花一天整理到沒有明顯漏洞，會後再收導師書面意見；這次不參加現場討論。','你把稿子修到自己滿意寄給導師，留在座位上安靜工作；會議裡那個相關問題，別人先聊完了。'),
    q('B05','bitter','exploration',[1,0],'資料乾淨得很可疑','你要選一份資料做本學期的分析。','整齊的怪資料','今天就能分析，可能揭開新現象；也可能花一個月仍說不清楚。','你今天就畫出那條奇怪曲線。月底仍解不開原因，但實驗室開始叫它「那條曲線」。','混亂的熟資料','得花一個月清理；之後結果穩定，卻大致重現已知趨勢。','你一個月都在修欄位和補缺值，最後確認了熟悉的趨勢，圖表乾淨得像剛掃過地。'),
    q('B06','bitter','rigor',[0,1],'回顧文獻的兩種速度','下個月的文獻回顧，你只能保留一種閱讀超能力。','快速讀完一輪','今天就能掌握所有摘要與結論，但引用前無法確認方法和限制。','你一口氣讀完摘要，回顧初稿很快成形；其中一篇和你問題的適用性仍留著問號。','逐篇核對方法','每篇都要查方法、樣本與限制，寫回顧的速度慢很多。','你逐篇對過方法和樣本，晚了幾天交稿；文獻適不適用有了依據。'),
    q('B07','bitter','collaboration',[0,1],'你要哪個座位？','接下來一學期，你只能固定坐實驗室的一個位置。','安靜角落','每天有三小時完整專注，但臨時合作和走廊點子常錯過。','你每天把三小時用到淋漓盡致，直到聽說隔壁剛好組成一個你很想加入的小組。','採光門口','消息與合作先找上你，但每專注 20 分鐘就有人來問近況。','你先接住新合作，再花整天回答「最近在做什麼？」；晚上終於有二十分鐘連續安靜。'),
    q('B08','bitter','rigor',[0,1],'投稿前，還要再跑一次？','同一篇稿件只能選一種投稿前檢查方式，編輯都會在三天內決定是否送審。','快速自查','今天就能投，初稿可用；但只核對格式與明顯錯字，方法細節仍有待確認。','你照格式清單掃過一遍，稿件如期送審；那個變項仍留著一個「之後確認」的註記。','重做關鍵分析','要多花兩週確認結果能否重現，投稿時間也往後延。','你多花兩週重跑關鍵分析，結果和原稿一致；投稿晚了，至少那個變項站得住腳。'),
    q('B09','bitter','rhythm',[1,0],'期限總有一種方式追上你','這學期所有作業與研究期限，只能用一種節奏安排。','每天一個小期限','每天都能推進一點，但研究永遠有一小塊在倒數。','你每天交出一小格進度，期末沒爆炸；只是行事曆每天都對你眨倒數的眼睛。','期末一次交完','前面時間自由，最後一週得同時收拾五件事。','你前半學期自由安排，最後一週對著五個檔案輪流喊「快好了」。'),
    q('B10','bitter','autonomy',[1,0],'到底算不算休假？','這學期每個週末都得選一種研究安排；指導教授也提供固定週末時段。','自己排好再休息','你自行決定週末要不要碰研究，休息完整；週一若忘了安排，得自己重新找回方向。','你把週末排成完全離線，週一花半天重讀筆記；至少這半天也是你自己排的。','教授安排二十分鐘','教授每週指定一個週末時段和下一步，卡關能即時得到指導；休息時間因此固定被切開。','你照教授排的時段完成小任務，週一直接接上進度；週日晚上仍覺得休假是不是忘了開始。')
  ];
  const tradeoff = [
    q('T01','tradeoff','exploration',[1,0],'興趣，還是準時畢業？','你還有一年完成學位，兩個題目都能在期限內做完，只能選一個。','好奇但多半年','研究問題讓你很著迷，會用滿剩下的一年，比原先規劃多花半年。','你選了那個一直惦記的問題，多留半年追它；每次新結果都讓你想再多問一題。','熟悉且準時','已有成熟資料和方法，能照原先規劃準時完成，但你對問題興趣普通。','你沿著熟悉的方法完成論文，準時交稿；口試後立刻開始想下一個題目。'),

    ballot.style.setProperty('--scale','1.06');
    el('status').textContent = '往左或往右，還沒放手都能改變方向。';
  });
  ballot.addEventListener('pointermove',event => {
    if (!drag || event.pointerId !== drag.pointerId) return;
    const dx = event.clientX - drag.x;
    ballot.style.setProperty('--dx',dx + 'px');
    ballot.style.setProperty('--dy',(event.clientY - drag.y) + 'px');
    ballot.style.setProperty('--angle',Math.max(-28,Math.min(18,dx / 14 - 12)) + 'deg');
    const side = targetAt(event.clientX,event.clientY);
    for (const candidate of ['a','b']) el('drop-' + candidate).classList.toggle('target',side === candidate);
    el('center-note').textContent = side ? '放手，就決定' : '拖到任一側';
    el('status').textContent = side ? '放手選擇「' + game.getView().question[side].title + '」。' : '繼續拖到任一側。';
  });
  ballot.addEventListener('pointerup',event => {
    if (!drag || event.pointerId !== drag.pointerId) return;
    const side = targetAt(event.clientX,event.clientY);
    if (!side) { cancelDrag(); return; }
    const pointerId = drag.pointerId;
    drag = null;
    ballot.classList.remove('dragging');
    clearTargets();
    if (ballot.hasPointerCapture(pointerId)) ballot.releasePointerCapture(pointerId);
    dispatch({ type:'choose', side });
  });
  ballot.addEventListener('pointercancel',cancelDrag);
  ballot.addEventListener('lostpointercapture',cancelDrag);
  window.addEventListener('blur',cancelDrag);
  ballot.addEventListener('click',() => {
    if (game.getView().phase === 'choose' && !drag) el('status').textContent = '拖曳紙飛機、點選兩側選項，或按 1、2 選擇。';
  });
  document.addEventListener('keydown',event => {
    if (!event.ctrlKey && !event.metaKey && !event.altKey) document.documentElement.dataset.input = 'keyboard';
    if (event.key === 'Escape' && drag) { cancelDrag(); return; }
    if (busy || event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.target.isContentEditable) return;
    if (game.getView().phase === 'choose' && ['1','2'].includes(event.key)) {
      event.preventDefault(); cancelDrag(); dispatch({ type:'choose', side:event.key === '1' ? 'a' : 'b' });
    }
  });
  for (const side of ['a','b']) el('choose-' + side).addEventListener('click',() => dispatch({ type:'choose', side }));
  for (const name of ['next','reconsider','restart']) el(name).addEventListener('click',() => dispatch({ type:name }));
  window.addEventListener('resize',() => {
    cancelDrag();
    const view = game.getView();
    if (view.selected && view.phase === 'reveal') stamp(view.selected);
  });
  render();
  lockControls(false);
})();

</script>
</body>
</html>
